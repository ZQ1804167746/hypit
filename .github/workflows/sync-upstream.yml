name: Sync upstream

# 每天把上游 hypit-ai/hypit 的 main 合并进本 fork 的 main。
#
# 凭据说明：必须用 secrets.SYNC_TOKEN —— 一个 fine-grained PAT，作用域仅限本仓库，
# 权限勾 Contents(RW) + Workflows(RW)。Actions 内置的 GITHUB_TOKEN 永远拿不到
# workflows 写权限（permissions 块里没有这一项），上游只要改动 .github/workflows/
# 下任何文件，同步就会被 GitHub 以 HTTP 422 拒绝。
#
# 改频率改下面的 cron 即可；也可在 Actions 页面点 Run workflow 手动同步。

on:
  schedule:
    # UTC 18:30 = 北京时间次日 02:30。GitHub 排队高峰可能延后 1~3 小时，属正常。
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # 仅用于把上游带进来的 workflow 保持禁用状态

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::未配置 SYNC_TOKEN，已回退到 GITHUB_TOKEN；上游一旦改动 .github/workflows/ 本次同步就会失败"
          fi

          if ! out=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main 2>&1); then
            echo "$out"
            {
              echo "### ❌ 同步失败"
              echo ""
              echo '```'
              echo "$out"
              echo '```'
              if grep -qi "without .workflows. permission" <<<"$out"; then
                echo ""
                echo "**原因**：当前凭据没有 workflows 写权限。检查仓库 secret \`SYNC_TOKEN\` 是否存在、是否过期，"
                echo "以及该 token 是否同时勾了 Contents(Read and write) 与 Workflows(Read and write)。"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          merge_type=$(jq -r '.merge_type' <<<"$out")
          message=$(jq -r '.message' <<<"$out")
          echo "merge_type=${merge_type} :: ${message}"
          echo "merge_type=${merge_type}" >> "$GITHUB_OUTPUT"
          {
            echo "### ✅ 同步完成"
            echo ""
            echo "- 合并方式：\`${merge_type}\`（none = 上游无新提交）"
            echo "- 凭据：$([ "$HAS_PAT" = "true" ] && echo 'SYNC_TOKEN' || echo 'GITHUB_TOKEN（回退）')"
            echo "- 上游：https://github.com/hypit-ai/hypit"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TYPE: ${{ steps.merge.outputs.merge_type }}
        run: |
          set -uo pipefail
          # 上游新增的 workflow 被同步进来后默认是启用的，会跟着后续 push 在本 fork 里跑。
          # GitHub 索引新 workflow 文件有几秒到几十秒延迟，紧跟合并扫一遍会漏掉它们，
          # 所以真的合入了东西时多扫几轮；没合入就只快速确认一遍。
          rounds=1
          if [ "${MERGE_TYPE:-none}" != "none" ]; then rounds=4; fi

          for r in $(seq 1 "$rounds"); do
            if [ "$r" -gt 1 ]; then sleep 15; fi
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
              --jq '.workflows[] | select(.state=="active") | select(.path!=".github/workflows/sync-upstream.yml") | "\(.id)\t\(.path)"' \
            | while IFS=$'\t' read -r id path; do
                [ -z "${id:-}" ] && continue
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" \
                  && echo "第 ${r} 轮：已禁用上游带入的 workflow ${path}"
              done
          done
